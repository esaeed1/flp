name: Refresh property data

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ingest
      - name: Commit refreshed data
        run: |
          git config user.name "county-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/generated
          git diff --cached --quiet || git commit -m "chore: refresh property data from government sources"
          git push
